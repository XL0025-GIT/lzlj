<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给你的祝福</title>
<style>
  /* ===================== 基础 ===================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; min-height: 100%; }
  body {
    font-family: "KaiTi", "STKaiti", "楷体", "Noto Serif SC", serif;
    background: linear-gradient(160deg, #fff7fa 0%, #ffeef4 45%, #ffe0eb 100%);
    overflow-x: hidden;
  }

  /* 背景柔光泡泡 */
  .bg-deco {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle 300px at 12% 18%, rgba(255,182,201,.45), transparent 70%),
      radial-gradient(circle 360px at 88% 30%, rgba(255,201,219,.4), transparent 70%),
      radial-gradient(circle 320px at 70% 85%, rgba(255,190,210,.35), transparent 70%);
  }

  /* 花瓣与爱心画布 */
  #fx { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  /* ===================== 开场封面 ===================== */
  #cover {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(150deg, #ffe9f0 0%, #ffdbe7 55%, #ffcfdf 100%);
    transition: opacity 1.1s ease;
  }
  #cover.gone { opacity: 0; pointer-events: none; }
  .cover-heart {
    width: 110px; height: 110px;
    filter: drop-shadow(0 10px 24px rgba(255,107,149,.45));
    animation: beat 1.7s ease-in-out infinite;
  }
  @keyframes beat {
    0%, 70%, 100% { transform: scale(1); }
    14% { transform: scale(1.13); }
    28% { transform: scale(1); }
    42% { transform: scale(1.09); }
  }
  #cover h2 {
    margin-top: 34px; font-size: 28px; font-weight: normal;
    letter-spacing: 8px; color: #c2557e;
  }
  #cover .sub {
    margin-top: 14px; font-size: 14px; letter-spacing: 3px; color: #b0788d;
  }
  #openBtn {
    margin-top: 44px; padding: 14px 48px;
    border: none; border-radius: 999px; cursor: pointer;
    background: linear-gradient(135deg, #ff9eb5, #ff7fa5);
    color: #fff; font-size: 18px; letter-spacing: 8px; text-indent: 8px;
    font-family: inherit;
    box-shadow: 0 8px 26px rgba(255,127,165,.5);
    animation: glowPulse 2.4s ease-in-out infinite;
    transition: transform .25s ease;
  }
  #openBtn:hover { transform: scale(1.07); }
  #openBtn:active { transform: scale(0.97); }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 8px 26px rgba(255,127,165,.45); }
    50% { box-shadow: 0 8px 40px rgba(255,127,165,.85); }
  }

  /* ===================== 主内容 ===================== */
  #content {
    position: relative; z-index: 2;
    max-width: 680px; margin: 0 auto;
    padding: 52px 22px 90px;
    opacity: 0; transform: translateY(24px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  #content.shown { opacity: 1; transform: none; }

  .date {
    text-align: center; color: #c78ba0;
    font-size: 14px; letter-spacing: 4px; margin-bottom: 8px;
  }
  .title {
    text-align: center; font-weight: normal;
    font-size: clamp(30px, 6vw, 44px);
    letter-spacing: 10px; text-indent: 10px;
    margin: 6px 0 30px;
    background: linear-gradient(120deg, #ff7fa5, #ff9eb5, #ffc2d4, #ff7fa5);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: shimmer 5s linear infinite;
  }
  @keyframes shimmer { to { background-position: 300% 0; } }

  /* 发光旋转边框卡片 */
  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  .card {
    --a: 0deg;
    position: relative; border-radius: 24px;
    background: rgba(255,255,255,.74);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: clamp(26px, 5vw, 44px) clamp(22px, 5vw, 42px);
  }
  .card::before {
    content: ''; position: absolute; inset: -3px; border-radius: 27px; z-index: -1;
    background: conic-gradient(from var(--a), #ffb6c9, #ffd6e3, #ff9eb5, #ffc8d8, #ffb6c9);
    animation: ringSpin 6s linear infinite;
    box-shadow: 0 0 34px rgba(255,158,181,.5), 0 12px 44px rgba(255,158,181,.28);
  }
  @keyframes ringSpin { to { --a: 360deg; } }

  .letter { color: #9c5570; font-size: clamp(16px, 2.4vw, 19px); }
  .letter p { line-height: 2.15; }
  .greet { letter-spacing: 2px; margin-bottom: 10px; }
  .line, .closing, .sign {
    opacity: 0; transform: translateY(16px);
    transition: opacity .9s ease, transform .9s ease;
  }
  #content.shown .line, #content.shown .closing, #content.shown .sign {
    opacity: 1; transform: none;
  }
  .closing {
    margin-top: 20px; color: #d4718f; font-weight: bold; letter-spacing: 3px;
  }
  .sign { text-align: right; color: #c78ba0; margin-top: 14px; letter-spacing: 2px; }

  .hint {
    text-align: center; margin-top: 30px;
    color: #d8a2b5; font-size: 13px; letter-spacing: 3px;
  }

  /* ===================== 音乐按钮(小唱片) ===================== */
  #disc {
    position: fixed; top: 18px; right: 18px; z-index: 60;
    width: 48px; height: 48px; border: none; border-radius: 50%; cursor: pointer;
    background: linear-gradient(135deg, #ff9eb5, #ff6b95);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(255,107,149,.5);
    opacity: 0; pointer-events: none; transition: opacity .8s ease;
  }
  #disc.show { opacity: 1; pointer-events: auto; }
  #disc svg { width: 22px; height: 22px; }
  #disc.spin { animation: rotate 5s linear infinite; animation-play-state: paused; }
  #disc.playing.spin { animation-play-state: running; }
  @keyframes rotate { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="bg-deco"></div>
<canvas id="fx"></canvas>

<!-- 开场封面(点击后才能播放音乐,这是浏览器的规定) -->
<div id="cover">
  <svg class="cover-heart" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff9eb5"/>
        <stop offset="1" stop-color="#ff6b95"/>
      </linearGradient>
    </defs>
    <path fill="url(#hg)" d="M50 88 C20 65 8 45 8 30 C8 15 20 6 32 6 C40 6 46 10 50 16 C54 10 60 6 68 6 C80 6 92 15 92 30 C92 45 80 65 50 88 Z"/>
  </svg>
  <h2>有一份心意</h2>
  <div class="sub">点击下方开启 · 记得打开声音</div>
  <button id="openBtn">开 启 祝 福</button>
</div>

<!-- 祝福正文 -->
<main id="content">
  <div class="date" id="date"></div>
  <h1 class="title" id="title"></h1>
  <section class="card">
    <div class="letter">
      <p class="greet" id="greet"></p>
      <div id="lines"></div>
      <p class="closing" id="closing"></p>
      <p class="sign" id="sign"></p>
    </div>
  </section>
  <p class="hint">轻触屏幕任意位置,会有惊喜飘落</p>
</main>

<!-- 音乐开关(小唱片,播放时旋转) -->
<button id="disc" title="播放 / 暂停音乐">
  <svg viewBox="0 0 24 24" fill="none">
    <path d="M12 21s-7.2-4.8-9.6-8.7C.4 8.6 2.7 5 6.2 5c2.1 0 3.6 1.1 4.6 2.7h2.4C14.2 6.1 15.7 5 17.8 5c3.5 0 5.8 3.6 3.8 7.3C19.2 16.2 12 21 12 21z" fill="#fff" opacity=".95"/>
  </svg>
</button>

<audio id="bgm" loop preload="auto">
  <source id="bgmSrc" src="music.mp3" type="audio/mpeg">
</audio>

<script>
(() => {
  'use strict';

  // ===================== 在这里改内容 =====================
  const CONFIG = {
    toName:   '朱丽娟',        // 改成她的名字或昵称
    fromName: 'L',          // 落款,可改成自己的名字
    title:    '致 可爱的你',
    closing:  '—— 平安喜乐,万事胜意',
    musicFile: 'music.mp3',        // 把喜欢的歌命名为 music.mp3 放在本网页同一文件夹;没有则自动播放内置轻音乐
    lines: [
      '愿你的每一天,都被温柔以待,',
      '愿你所遇皆良善,所行皆坦途;',
      '愿你笑靥如花,眉目舒展,',
      '愿你想要的都拥有,得不到的都释怀;',
      '愿你眼里有星辰与远方,',
      '愿你心中有暖阳与希望。',
      '余生很长,愿你被这个世界偏爱。',
    ],
  };
  // =======================================================

  // 填充文字
  document.getElementById('title').textContent = CONFIG.title;
  document.getElementById('greet').textContent = CONFIG.toName + '：';
  document.getElementById('closing').textContent = CONFIG.closing;
  document.getElementById('sign').textContent = '—— ' + CONFIG.fromName;
  const d = new Date();
  document.getElementById('date').textContent =
    d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
  document.getElementById('bgmSrc').src = CONFIG.musicFile;

  const linesBox = document.getElementById('lines');
  CONFIG.lines.forEach((txt, i) => {
    const p = document.createElement('p');
    p.className = 'line';
    p.textContent = txt;
    p.style.transitionDelay = (0.25 + i * 0.3) + 's';
    linesBox.appendChild(p);
  });

  // ===================== 画布:花瓣 + 点击爱心 =====================
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const PETAL_COLORS = ['#ffd3e0', '#ffc2d4', '#ffe0ea', '#ffb3c9', '#ffdce7'];
  const petals = [];
  function makePetal(top) {
    return {
      x: rand(0, W),
      y: top ? -20 : rand(-H * 0.3, H),
      size: rand(6, 14),
      vy: rand(22, 55),
      amp: rand(18, 46), freq: rand(0.5, 1.4), ph: rand(0, 6.28),
      rot: rand(0, 6.28), vr: rand(-1.6, 1.6),
      color: PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)],
      alpha: rand(0.5, 0.95),
    };
  }
  for (let i = 0; i < 34; i++) petals.push(makePetal(false));

  const hearts = []; // 点击时冒出的爱心
  function burst(x, y) {
    const n = 7 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      const ang = rand(-Math.PI * 0.9, -Math.PI * 0.1);
      const sp = rand(60, 160);
      hearts.push({
        x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        size: rand(6, 13), life: 0, maxLife: rand(1.1, 1.8),
        color: Math.random() < 0.5 ? '#ff8fb0' : '#ffa8c0',
        rot: rand(-0.4, 0.4),
      });
    }
  }

  let t = 0, last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now; t += dt;
    ctx.clearRect(0, 0, W, H);

    // 花瓣
    for (const p of petals) {
      p.y += p.vy * dt;
      p.x += Math.sin(t * p.freq + p.ph) * p.amp * dt;
      p.rot += p.vr * dt;
      if (p.y > H + 24) Object.assign(p, makePetal(true));
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      const s = p.size;
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.5);
      ctx.bezierCurveTo(s * 0.7, -s * 0.3, s * 0.5, s * 0.4, 0, s * 0.5);
      ctx.bezierCurveTo(-s * 0.5, s * 0.4, -s * 0.7, -s * 0.3, 0, -s * 0.5);
      ctx.fill();
      ctx.restore();
    }

    // 爱心
    for (let i = hearts.length - 1; i >= 0; i--) {
      const h = hearts[i];
      h.life += dt;
      if (h.life > h.maxLife) { hearts.splice(i, 1); continue; }
      h.x += h.vx * dt; h.y += h.vy * dt;
      h.vy += 60 * dt;            // 有一点重力,像被抛起
      h.vx *= (1 - dt * 1.2);
      const k = h.life / h.maxLife;
      const alpha = k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85;
      const s = h.size * (1 - k * 0.25);
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rot);
      ctx.scale(s / 10, s / 10);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = h.color;
      ctx.shadowColor = h.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(0, 3.2);
      ctx.bezierCurveTo(-10, -4.5, -5.2, -11, 0, -5.2);
      ctx.bezierCurveTo(5.2, -11, 10, -4.5, 0, 3.2);
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ===================== 音乐 =====================
  const bgm = document.getElementById('bgm');
  const disc = document.getElementById('disc');
  let engine = null;          // 'audio' | 'web'
  let webCtx = null;
  let musicReady = false;

  // 内置轻音乐:音乐盒风格的琶音(没有歌曲文件时自动使用)
  function startWebMusic() {
    if (webCtx) { webCtx.resume(); return; }
    webCtx = new (window.AudioContext || window.webkitAudioContext)();
    const master = webCtx.createGain();
    master.gain.value = 0.5;
    master.connect(webCtx.destination);

    const F = {
      C3: 130.81, E3: 164.81, F3: 174.61, G3: 196.0, A3: 220.0, B3: 246.94,
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.0, A4: 440.0,
      C5: 523.25, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880,
    };
    // C → G → Am → F 经典进行,每小节 8 个八分音符
    const pattern = [
      ['C4', 'E4', 'G4', 'C5', 'G4', 'E4', 'C4', 'G4'],
      ['G3', 'B3', 'D4', 'G4', 'D4', 'B3', 'G3', 'D4'],
      ['A3', 'C4', 'E4', 'A4', 'E4', 'C4', 'A3', 'E4'],
      ['F3', 'A3', 'C4', 'F4', 'C4', 'A3', 'F3', 'C4'],
    ];
    function noteAt(time, freq, dur, vol) {
      const o = webCtx.createOscillator(), g = webCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(vol, time + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      o.connect(g); g.connect(master);
      o.start(time); o.stop(time + dur + 0.05);
    }
    let bar = 0, step = 0, nextTime = webCtx.currentTime + 0.1;
    const eighth = 0.32;
    setInterval(() => {
      while (nextTime < webCtx.currentTime + 1.2) {
        const seq = pattern[bar % 4];
        noteAt(nextTime, F[seq[step % 8]] * 2, 1.4, 0.11);       // 高八度,清脆音乐盒音色
        if (step % 8 === 0) noteAt(nextTime, F[seq[0]], 2.4, 0.05); // 低音铺底
        nextTime += eighth;
        step++;
        if (step % 8 === 0) bar++;
      }
    }, 200);
  }

  function setDisc(playing) {
    disc.classList.add('spin');
    disc.classList.toggle('playing', playing);
  }

  function startMusic() {
    if (musicReady) return;
    musicReady = true;
    bgm.play().then(() => {
      engine = 'audio';
      setDisc(true);
    }).catch(() => {
      // 没有歌曲文件或加载失败 → 内置轻音乐
      engine = 'web';
      startWebMusic();
      setDisc(true);
    });
  }
  bgm.addEventListener('error', () => {
    if (engine === 'audio') return;
    engine = 'web';
    startWebMusic();
    setDisc(true);
  });
  bgm.addEventListener('play',  () => setDisc(true));
  bgm.addEventListener('pause', () => setDisc(false));

  disc.addEventListener('click', () => {
    if (engine === 'audio') {
      bgm.paused ? bgm.play() : bgm.pause();
    } else if (engine === 'web' && webCtx) {
      webCtx.state === 'running' ? webCtx.suspend() : webCtx.resume();
      setDisc(webCtx.state !== 'running');
    }
  });

  // ===================== 开场与互动 =====================
  let opened = false;
  const cover = document.getElementById('cover');
  const content = document.getElementById('content');

  document.getElementById('openBtn').addEventListener('click', e => {
    e.stopPropagation();
    opened = true;
    cover.classList.add('gone');
    content.classList.add('shown');
    disc.classList.add('show');
    startMusic();
    burst(window.innerWidth / 2, window.innerHeight / 2);
  });

  window.addEventListener('pointerdown', e => {
    if (!opened) return;
    burst(e.clientX, e.clientY);
  });
})();
</script>
</body>
</html>
